<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stereo Display · Manual History</title><style>
:root{color-scheme:dark}body{background:#15181d;color:#f0f1f4;font:16px system-ui,sans-serif;max-width:1060px;margin:24px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center}a{color:#9bbded;text-decoration:none}nav a{margin-right:18px}main{margin-top:24px}.panel{background:#23272e;padding:20px;border-radius:12px;margin:14px 0}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.grow{flex:1}input,button,select{font:inherit;border:1px solid #565d69;border-radius:7px;padding:10px;background:#303640;color:white}input[type=text],input[type=password],input[type=datetime-local]{max-width:100%;box-sizing:border-box}button,.button{cursor:pointer;background:#315b98;border:0;padding:11px 15px;border-radius:7px;color:white}.muted,small{color:#b3bcc7}.track{padding:10px 0;border-bottom:1px solid #393f49;display:flex;align-items:center;gap:14px}.track label{flex:1}.track input[type=text]{width:100%}.cover{max-width:160px;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}.card img{width:100%;aspect-ratio:1;object-fit:cover}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #3e444c}.flash{background:#4b3c29;padding:10px;border-radius:6px}.small{font-size:13px}
</style></head><body><header><div><h2>Stereo Display</h2><nav><a href="{{url_for('index')}}">History</a><a href="{{url_for('song')}}">Single song</a></nav></div>{% if session.authenticated %}<form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf" value="{{csrf}}"><button>Sign out</button></form>{% endif %}</header><main>{% for m in get_flashed_messages() %}<p class="flash">{{m}}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
