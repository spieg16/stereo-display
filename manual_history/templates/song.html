{% extends 'base.html' %}{% block content %}<h2>Log an individual song</h2><form class="panel" method="post" action="{{url_for('submit')}}"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="selected" value="0"><input type="hidden" name="now_index" value="0"><p><label>Artist <input type="text" name="artist" required></label></p><p><label>Album <input type="text" name="album"></label></p><p><label>Song <input type="text" name="title" required></label></p><input type="hidden" name="duration" value=""><p><label>Played at (blank = now) <input type="datetime-local" name="played_at"></label></p><p><label><input type="checkbox" name="confirm_duplicates" value="1"> Allow potential duplicates</label></p><p><button>Log song + update Tronbyt</button></p></form>{% endblock %}
